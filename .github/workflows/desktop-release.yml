name: Desktop Release

# Builds Open DeepTutor for macOS from the release tag and attaches the DMG to
# the same GitHub Release that pypi-release.yml publishes, so every DeepTutor
# release ships "Open DeepTutor MacOS v<version>" alongside "Web v<version>".
#
# Secrets:
#   DESKTOP_RUNTIME_SIGNING_KEY  (required) Ed25519 PEM matching
#                                apps/desktop/assets/runtime-public.pem.
#   APPLE_CERTIFICATE_P12, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD
#                                (optional) Developer ID signing and
#                                notarization. Without them the app is signed
#                                ad hoc and Gatekeeper warns on first open.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build the macOS app for
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  macos:
    name: Build Open DeepTutor for macOS
    if: startsWith(inputs.tag || github.event.release.tag_name, 'v')
    runs-on: macos-15
    timeout-minutes: 90
    env:
      HAS_DEVELOPER_ID: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify release tag matches deeptutor/__version__.py
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^__version__ = "([^"]+)"/\1/p' ../../deeptutor/__version__.py)"
          if [ "v$version" != "$RELEASE_TAG" ]; then
            echo "Release tag $RELEASE_TAG does not match deeptutor/__version__.py ($version)." >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            web/package-lock.json

      - uses: astral-sh/setup-uv@v6

      - name: Check and test the shell
        run: npm ci && npm run check && npm test

      - name: Import the Developer ID certificate
        if: env.HAS_DEVELOPER_ID == 'true'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Build the bundled runtime
        env:
          OPEN_DEEPTUTOR_SIGNING_KEY: ${{ secrets.DESKTOP_RUNTIME_SIGNING_KEY }}
        run: npm run build:runtime

      - name: Boot the bundled runtime
        run: npm run smoke

      - name: Package the app and DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: npm run package:mac && npm run package:dmg

      - name: Notarize the DMG
        if: env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(ls out/Open-DeepTutor-MacOS-*.dmg)"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$dmg"

      - name: Attach the DMG to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" out/Open-DeepTutor-MacOS-*.dmg --clobber
